<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="src/style.css" rel="stylesheet" type="text/css">
        <script defer src="src/main.js"></script>
        <title>Prefecturas de Japón </title>
    </head>
    <body>
        <header>
            <h1>Cátalogo de las prefecturas japonesas</h1>
        </header>

        <main>
            <div class="controls">
                <input id="buscador" type="search" placeholder="Busca una prefectura">

                <button id="aleatorio">Al azar</button>
                <select id="selector">
                    <option>Por ID</option>
                    <option>Habitantes descendente</option>
                    <option>Habitantes ascendente</option>
                    <option>Área descendente</option>
                    <option>Área ascendente</option>
                </select>
                <select id="selectorRegion">
                    <option>Todas</option>
                    <option>Hokkaido</option>
                    <option>Tohoku</option>
                    <option>Kanto</option>
                    <option>Chubu</option>
                    <option>Kansai</option>
                    <option>Chugoku</option>
                    <option>Shikoku</option>
                    <option>Kyushu</option>
                    <option>Okinawa</option>
                </select>

                <button id="modo">Cambiar a Japones</button>
            </div>

            <p id="estado">Cargando prefecturas</p>
            <section id="lista"></section>
        </main>

    </body>
</html>
