<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="src/style.css" rel="stylesheet" type="text/css">
        <script defer src="src/main.js"></script>
        <title>Prefecturas de Japón </title>
    </head>
    <body>
        <header>
            <h1>Cátalogo de las prefecturas japonesas</h1>
        </header>

        <main>
            <div class="controls">
                <input id="buscador" type="search" placeholder="Busca una prefectura">

                <button id="aleatorio">
                    Al azar
                </button>
                <select id="selector">
                    <option name="1">Por ID</option>
                    <option name="2">Más a menos habitantes</option>
                    <option name="3">Menos a más habitantes</option>
                </select>
            </div>

            <p id="estado">Cargando prefecturas...</p>
            <section id="lista"></section>
        </main>

    </body>
</html>
