<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="module" src="/src/main.js"></script>
        <title>Prefecturas de Japón </title>
    </head>
    <body>
        <div class="controls">
            <input id="buscador" type="search" placeholder="Busca una prefectura">

            <button id="aleatorio" type="button">Al azar</button>

            <select id="selector">
                <option value="id">Por ID</option>
                <option value="poblacionDesc">Habitantes descendente</option>
                <option value="poblacionAsc">Habitantes ascendente</option>
                <option value="areaDesc">Área descendente</option>
                <option value="areaAsc">Área ascendente</option>
            </select>

            <select id="selectorRegion">
                <option value="Todas">Todas</option>
                <option value="Hokkaido">Hokkaido</option>
                <option value="Tohoku">Tohoku</option>
                <option value="Kanto">Kanto</option>
                <option value="Chubu">Chubu</option>
                <option value="Kansai">Kansai</option>
                <option value="Chugoku">Chugoku</option>
                <option value="Shikoku">Shikoku</option>
                <option value="Kyushu">Kyushu</option>
                <option value="Okinawa">Okinawa</option>
            </select>

            <button id="modo" type="button">Cambiar a Japonés</button>
        </div>

        <p id="estado" role="status" aria-live="polite">Cargando prefecturas…</p>

        <button id="reintentar" type="button" hidden>Reintentar</button>

        <p id="resumen" aria-live="polite"></p>

        <section id="lista" aria-label="Prefecturas"></section>

    </body>
</html>
